# Render Blueprint: the API (web service) and the web app (static site).
# The database is hosted on Neon; its connection string is supplied as DATABASE_URL.

services:
  - type: web
    name: ai-travel-assistant-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci
    # Runs on every boot: migrations, then a demo refresh when the data is missing or a week old
    startCommand: npm run migrate && npm run seed:auto && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        fromService:
          type: web
          name: ai-travel-assistant
          property: host

  - type: web
    name: ai-travel-assistant
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Client-side routes such as /trips/42 are served by index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked in at build time; src/lib/apiBase.js turns it into https://<host>/api
      - key: VITE_API_HOST
        fromService:
          type: web
          name: ai-travel-assistant-api
          property: host
